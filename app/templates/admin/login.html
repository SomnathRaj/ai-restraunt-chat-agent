<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — {{ config.RESTAURANT_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/style.css') }}" />
</head>
<body class="admin-login-body">
  <div class="admin-login-card">
    <h1>🍽 {{ config.RESTAURANT_NAME }}<br />Admin Login</h1>

    {% if error %}
    <p class="admin-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <label for="admin-email">Email</label>
      <input id="admin-email" type="email" name="email" required autofocus autocomplete="username" />

      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" name="password" required autocomplete="current-password" />

      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
