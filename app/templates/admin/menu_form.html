{% extends "admin/layout.html" %}

{% block title %}{{ "Edit item" if item and item.item_id else "New item" }}{% endblock %}

{% block content %}
<h1>{{ "Edit menu item" if item and item.item_id else "New menu item" }}</h1>

{% if error %}
<p class="admin-error" role="alert">{{ error }}</p>
{% endif %}

<form class="admin-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

  <label for="name">Name
    <input id="name" type="text" name="name" value="{{ item.name if item else '' }}" required />
  </label>

  <label for="description">Description
    <textarea id="description" name="description">{{ item.description if item else '' }}</textarea>
  </label>

  <label for="category">Category
    <select id="category" name="category" required>
      <option value="">— choose a category —</option>
      {% for category in categories %}
      <option value="{{ category }}" {% if item and item.category == category %}selected{% endif %}>{{ category }}</option>
      {% endfor %}
    </select>
  </label>

  <label for="price">Price (₹)
    <input id="price" type="number" step="0.01" min="0.01" name="price" value="{{ item.price if item else '' }}" required />
  </label>

  <label for="tags">Tags (comma-separated)
    <input id="tags" type="text" name="tags"
           value="{{ (item.tags if item.tags is string else item.tags|join(', ')) if item and item.tags else '' }}" />
  </label>

  <label for="image">Image URL (optional)
    <input id="image" type="url" name="image" value="{{ item.image if item and item.image else '' }}" />
  </label>

  <label class="admin-checkbox-label">
    <input type="checkbox" name="availability" {% if not item or item.availability %}checked{% endif %} />
    Available (in stock)
  </label>

  <label class="admin-checkbox-label">
    <input type="checkbox" name="is_veg" {% if item and item.is_veg %}checked{% endif %} />
    Vegetarian
  </label>

  <div class="admin-form-actions">
    <button type="submit" class="admin-button">Save</button>
    <a class="admin-button admin-button-muted" href="{{ url_for('admin.menu_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
