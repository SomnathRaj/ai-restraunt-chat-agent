<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ restaurant_name }} — Order by Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03A3.99 3.99 0 0 0 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
        </span>
        <span class="brand-name">{{ restaurant_name }}</span>
      </div>
      <button id="cart-toggle" class="cart-toggle" type="button" aria-label="View your order">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
        <span id="cart-count" class="cart-count" hidden>0</span>
      </button>
    </header>

    <section id="hero">
      <h1>Welcome to {{ restaurant_name }}</h1>
      <p>Delicious food, simply ordered.</p>
    </section>

    <main id="chat-panel">
      <div id="chat-log" aria-live="polite"></div>

      <div id="typing-indicator" class="typing-indicator" hidden>
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03A3.99 3.99 0 0 0 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
        </span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>

      <div id="quick-actions" class="quick-actions">
        <button type="button" class="quick-action" data-action="view-menu">View Menu</button>
      </div>

      <form id="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type your message..." aria-label="Message" />
        <button type="submit" class="send-button" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>
    </main>
  </div>

  <div id="cart-backdrop" class="cart-backdrop" hidden></div>
  <aside id="cart-panel" class="cart-panel" hidden aria-label="Your order">
    <div class="cart-panel-header">
      <h2>Your Order</h2>
      <button id="cart-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z"/></svg>
      </button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-notes" id="cart-notes" hidden></div>
    <div class="cart-total-row">
      <span>Total</span>
      <span id="cart-total">₹0</span>
    </div>
  </aside>

  <template id="ai-avatar-template">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03A3.99 3.99 0 0 0 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
  </template>
  <template id="menu-card-image-template">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03A3.99 3.99 0 0 0 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
  </template>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
